# moto stands in for AWS Secrets Manager, since the demo runs without AWS. The proxy
# reaches it through AWS_ENDPOINT_URL, set only by the test overlay (test/workspace).
apiVersion: v1
kind: Namespace
metadata:
  name: moto
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: moto
  namespace: moto
spec:
  replicas: 1
  selector:
    matchLabels:
      app: moto
  template:
    metadata:
      labels:
        app: moto
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: moto
          image: docker.io/motoserver/moto:5.2.5@sha256:59a1965d845249b04def37a0e2565f9cc6c44543cb89b68e90f28f344b3b0d1a
          command: ["moto_server", "-H", "0.0.0.0", "-p", "5000"]
          env:
            - name: HOME
              value: /tmp
          ports:
            - name: api
              containerPort: 5000
          readinessProbe:
            tcpSocket:
              port: api
            periodSeconds: 2
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: moto
  namespace: moto
spec:
  selector:
    app: moto
  ports:
    - name: api
      port: 5000
      targetPort: api
---
# Only proxy namespaces reach moto, and moto reaches nothing.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: moto
  namespace: moto
spec:
  podSelector: {}
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              agentd.dev/proxy-namespace: "true"
      ports:
        - port: 5000
          protocol: TCP
  egress: []
