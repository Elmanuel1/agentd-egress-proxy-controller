# Stands in for the metrics and logs backend the platform picks. It receives
# OTLP/gRPC over TLS from the Collector and writes what it gets as OTLP JSON to
# stdout, where the checks read it with kubectl logs.
apiVersion: v1
kind: Namespace
metadata:
  name: otel-backend
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: otel-backend-tls
  namespace: otel-backend
spec:
  secretName: otel-backend-tls
  dnsNames:
    - otel-backend.otel-backend.svc.cluster.local
  privateKey:
    algorithm: ECDSA
    size: 256
  usages:
    - server auth
    - digital signature
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: agentd-root-ca
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-backend
  namespace: otel-backend
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
            tls:
              cert_file: /tls/tls.crt
              key_file: /tls/tls.key
    exporters:
      file:
        path: /dev/stdout
        flush_interval: 1s
    service:
      pipelines:
        logs:
          receivers: [otlp]
          exporters: [file]
        metrics:
          receivers: [otlp]
          exporters: [file]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-backend
  namespace: otel-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: otel-backend
  template:
    metadata:
      labels:
        app: otel-backend
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: otel-backend
          image: docker.io/otel/opentelemetry-collector-contrib:0.165.0@sha256:e40d61f10c9a617cca1ffd1be4d7e2b3a4b0f0001798ff07e58cabe82e618cea
          args: ["--config=/conf/config.yaml"]
          ports:
            - name: otlp-grpc
              containerPort: 4317
          readinessProbe:
            tcpSocket:
              port: otlp-grpc
            periodSeconds: 2
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /conf
              readOnly: true
            - name: tls
              mountPath: /tls
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: otel-backend
        - name: tls
          secret:
            secretName: otel-backend-tls
            defaultMode: 0440
---
apiVersion: v1
kind: Service
metadata:
  name: otel-backend
  namespace: otel-backend
spec:
  selector:
    app: otel-backend
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
      protocol: TCP
---
# Only the Collector reaches the backend, and the backend reaches nothing.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: otel-backend
  namespace: otel-backend
spec:
  podSelector: {}
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
          podSelector:
            matchLabels:
              app: otel-collector
      ports:
        - port: 4317
          protocol: TCP
  egress: []
