# Fake HTTPS upstream for the e2e test. It answers every request with the Host
# and the SHA-256 of each request header value it received, as JSON, so the
# test can see what the proxy forwarded while no credential value travels back
# to the sandbox. Three headless Services name the same pod; headless so DNS gives
# the pod address (10.244.0.0/16) and the proxy dials the pod directly.
#   api      on the allowlist; the credential's host
#   other    on the allowlist; not the credential's host
#   blocked  not on the allowlist
#   missing  on the allowlist; host of a credential whose secret does not exist
apiVersion: v1
kind: Namespace
metadata:
  name: upstream
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: selfsigned
  namespace: upstream
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: upstream-ca
  namespace: upstream
spec:
  isCA: true
  commonName: e2e upstream test CA
  secretName: upstream-ca
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    kind: Issuer
    name: selfsigned
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: upstream-ca
  namespace: upstream
spec:
  ca:
    secretName: upstream-ca
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: echo-tls
  namespace: upstream
spec:
  secretName: echo-tls
  dnsNames:
    - api.upstream.svc.cluster.local
    - other.upstream.svc.cluster.local
    - blocked.upstream.svc.cluster.local
    - missing.upstream.svc.cluster.local
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    kind: Issuer
    name: upstream-ca
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: echo
  namespace: upstream
data:
  echo.py: |
    import hashlib
    import http.server
    import json
    import ssl
    import threading


    class Echo(http.server.BaseHTTPRequestHandler):
        def reply(self):
            body = json.dumps({
                "host": self.headers.get("Host"),
                "header_sha256": {
                    k.lower(): hashlib.sha256(v.encode()).hexdigest()
                    for k, v in self.headers.items()
                },
            }).encode()
            self.send_response(200)
            self.send_header("Content-Type", "application/json")
            self.send_header("Content-Length", str(len(body)))
            self.end_headers()
            self.wfile.write(body)

        do_GET = reply
        do_POST = reply


    # Plain HTTP on 8080, to show the proxy never swaps outside TLS.
    plain = http.server.ThreadingHTTPServer(("", 8080), Echo)
    threading.Thread(target=plain.serve_forever, daemon=True).start()

    ctx = ssl.SSLContext(ssl.PROTOCOL_TLS_SERVER)
    ctx.minimum_version = ssl.TLSVersion.TLSv1_2
    ctx.load_cert_chain("/tls/tls.crt", "/tls/tls.key")
    server = http.server.ThreadingHTTPServer(("", 8443), Echo)
    server.socket = ctx.wrap_socket(server.socket, server_side=True)
    server.serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: echo
  namespace: upstream
spec:
  replicas: 1
  selector:
    matchLabels:
      app: echo
  template:
    metadata:
      labels:
        app: echo
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: echo
          image: docker.io/library/python:3.13.18-alpine3.24@sha256:9ef1a599f863231c3d91e941389bfdc4a2d6070557243d54df1a4e57015b960e
          command: ["python3", "-u", "/app/echo.py"]
          ports:
            - name: https
              containerPort: 8443
            - name: http
              containerPort: 8080
          readinessProbe:
            tcpSocket:
              port: https
            periodSeconds: 2
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: app
              mountPath: /app
              readOnly: true
            - name: tls
              mountPath: /tls
              readOnly: true
      volumes:
        - name: app
          configMap:
            name: echo
        - name: tls
          secret:
            secretName: echo-tls
            defaultMode: 0440
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: upstream
spec:
  clusterIP: None
  selector:
    app: echo
  ports:
    - name: https
      port: 8443
      targetPort: https
---
apiVersion: v1
kind: Service
metadata:
  name: other
  namespace: upstream
spec:
  clusterIP: None
  selector:
    app: echo
  ports:
    - name: https
      port: 8443
      targetPort: https
---
apiVersion: v1
kind: Service
metadata:
  name: blocked
  namespace: upstream
spec:
  clusterIP: None
  selector:
    app: echo
  ports:
    - name: https
      port: 8443
      targetPort: https
---
apiVersion: v1
kind: Service
metadata:
  name: missing
  namespace: upstream
spec:
  clusterIP: None
  selector:
    app: echo
  ports:
    - name: https
      port: 8443
      targetPort: https
