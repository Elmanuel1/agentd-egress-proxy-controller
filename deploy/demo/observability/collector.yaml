# OpenTelemetry Collector that turns iron-proxy's OTLP audit log records into
# request metrics. iron-proxy v0.59.0 sends one log record per request. Its
# attributes include `action` ("allow", "reject" or "error"), `rejected_by`
# (on rejects only), `method`, and `request_transforms`, a list of
# {name, action, duration_ms, annotations} maps. The secrets transform's
# annotations hold `swapped` and `secret_unavailable` when they apply; a
# required secret that cannot be read sets `reject_reason: secret_unavailable`.
# Demo: the file exporter writes OTLP JSON to stdout so the checks read it with
# kubectl logs. A real deployment exports to its metrics and logs backends.
apiVersion: v1
kind: Namespace
metadata:
  name: observability
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector
  namespace: observability
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          http:
            endpoint: 0.0.0.0:4318
    processors:
      transform/flatten:
        error_mode: ignore
        log_statements:
          # IsMatch reads a list attribute as its JSON text and a missing one
          # as no match, so each flag is true only when an annotation is there.
          - set(log.attributes["swapped"], IsMatch(log.attributes["request_transforms"], "\"swapped\":"))
          - set(log.attributes["secret_unavailable"], IsMatch(log.attributes["request_transforms"], "secret_unavailable"))
    connectors:
      count:
        logs:
          egress_proxy_requests:
            description: Requests through the egress proxy, by outcome.
            conditions:
              # An allowed CONNECT only opens a tunnel; the request inside it
              # has its own record.
              - not (log.attributes["method"] == "CONNECT" and log.attributes["action"] == "allow")
            attributes:
              - key: action
              - key: rejected_by
                default_value: none
              - key: swapped
          egress_proxy_secret_failures:
            description: Requests for which a credential could not be read.
            conditions:
              - log.attributes["secret_unavailable"] == true
    exporters:
      file:
        path: /dev/stdout
        flush_interval: 1s
    service:
      pipelines:
        logs:
          receivers: [otlp]
          processors: [transform/flatten]
          exporters: [count, file]
        metrics:
          receivers: [count]
          exporters: [file]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app: otel-collector
  template:
    metadata:
      labels:
        app: otel-collector
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: otel-collector
          image: docker.io/otel/opentelemetry-collector-contrib:0.165.0@sha256:e40d61f10c9a617cca1ffd1be4d7e2b3a4b0f0001798ff07e58cabe82e618cea
          args: ["--config=/conf/config.yaml"]
          ports:
            - name: otlp-http
              containerPort: 4318
          readinessProbe:
            tcpSocket:
              port: otlp-http
            periodSeconds: 2
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /conf
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: otel-collector
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: observability
spec:
  selector:
    app: otel-collector
  ports:
    - name: otlp-http
      port: 4318
      targetPort: otlp-http
      protocol: TCP
---
# Only iron-proxy pods in proxy namespaces send to the Collector, and only on
# OTLP/HTTP. Sandboxes and every other pod are refused.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: otel-collector
  namespace: observability
spec:
  podSelector:
    matchLabels:
      app: otel-collector
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              agentd.dev/proxy-namespace: "true"
          podSelector:
            matchLabels:
              app.kubernetes.io/name: iron-proxy
      ports:
        - port: 4318
          protocol: TCP
