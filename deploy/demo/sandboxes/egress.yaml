# Sandbox egress is denied by default. A sandbox may resolve names through
# cluster DNS and open TCP 8080 to a proxy namespace; it reaches nothing else,
# so every outbound request goes through its workspace's proxy.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sandbox-egress
  namespace: sandboxes
spec:
  podSelector: {}
  policyTypes: ["Ingress", "Egress"]
  ingress: []
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              agentd.dev/proxy-namespace: "true"
      ports:
        - port: 8080
          protocol: TCP
