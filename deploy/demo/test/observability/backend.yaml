apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-backend
  namespace: observability
data:
  endpoint: otel-backend.otel-backend.svc.cluster.local:4317
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: otel-collector-backend
  namespace: observability
spec:
  podSelector:
    matchLabels:
      app: otel-collector
  policyTypes: ["Egress"]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: otel-backend
      ports:
        - port: 4317
          protocol: TCP
